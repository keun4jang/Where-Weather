name: Build Debug APK

# 클로드 없이 APK를 만드는 자동 빌드.
# 어떤 브랜치든 푸시하면 GitHub 서버가 APK를 빌드하고,
# "latest-apk" 릴리스에 올려서 폰에서 바로 받을 수 있게 한다.
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write # 릴리스에 APK 올리기용

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Capacitor CLI 8은 Node 22 이상 필요
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (typecheck, lint, test)
        run: npm run typecheck && npm run lint && npm run test

      - name: Build web app
        run: npm run build

      # Capacitor 8은 Java 21이 필요하다 (17이면 컴파일 실패)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 업데이트 설치가 되려면 모든 빌드가 같은 키로 서명돼야 한다.
      # 키는 저장소에 넣지 않고 GitHub Secret(ANDROID_DEBUG_KEYSTORE_B64)에서 꺼낸다.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 secret is missing — builds would be signed with a random key and in-app updates would fail."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/ww-debug.keystore

      # versionCode = 실행 번호(계속 증가) → 앱이 "새 버전"을 알아챌 수 있다
      - name: Build debug APK
        working-directory: android
        run: |
          VERSION_NAME=$(node -p "require('../package.json').version")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ./gradlew assembleDebug --no-daemon \
            -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"

      - name: Write version.json
        run: |
          printf '{"versionCode":%s,"versionName":"%s","sha":"%s"}\n' \
            "${{ github.run_number }}" "$VERSION_NAME" "${{ github.sha }}" > version.json
          cat version.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: where-weather-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 폰 브라우저에서 바로 받을 수 있는 고정 주소:
      # https://github.com/keun4jang/Where-Weather/releases/tag/latest-apk
      # APK를 먼저 올리고 version.json을 나중에 올린다
      # (앱이 새 버전을 감지했는데 APK가 아직 옛것인 상황 방지).
      - name: Publish APK to "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 최신 APK
          body: |
            자동 빌드 v${{ env.VERSION_NAME }} (#${{ github.run_number }}) — ${{ github.ref_name }} @ ${{ github.sha }}
            앱이 설치돼 있으면 앱 안에서 자동으로 업데이트를 알려줍니다.
            처음 설치할 때만 app-debug.apk 를 받아 설치하세요.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish version.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          files: version.json

  # claude/* 브랜치가 빌드·테스트를 통과하면 main에 자동 머지한다.
  # 충돌이 나면 이 단계가 실패하고 main은 그대로 남는다.
  merge-to-main:
    needs: build
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin main >/dev/null; then
            git fetch origin main
            git checkout -B main origin/main
            git merge --no-edit "$GITHUB_SHA" -m "Merge ${{ github.ref_name }} into main"
          else
            git checkout -B main "$GITHUB_SHA"
          fi
          git push origin main
