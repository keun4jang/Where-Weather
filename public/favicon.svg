<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Sun rays -->
  <g stroke="url(#sun)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="22" y1="10" x2="22" y2="7"/>
    <line x1="30" y1="8" x2="31.5" y2="5.5"/>
    <line x1="14" y1="15" x2="12" y2="13.5"/>
    <line x1="12" y1="23" x2="9" y2="23"/>
    <line x1="13" y1="31" x2="10.5" y2="32.5"/>
  </g>
  <!-- Sun -->
  <circle cx="22" cy="22" r="9" fill="url(#sun)"/>
  <!-- Cloud -->
  <path d="M17 38 a8 8 0 0 1 .5-16 A11 11 0 0 1 46 27 a7 7 0 0 1-1 14 Z" fill="url(#cloud)"/>
  <!-- Rain drops -->
  <g fill="#60a5fa" opacity="0.9">
    <ellipse cx="23" cy="51" rx="1.8" ry="3"/>
    <ellipse cx="31" cy="54" rx="1.8" ry="3"/>
    <ellipse cx="39" cy="51" rx="1.8" ry="3"/>
  </g>
</svg>
